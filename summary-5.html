<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8fc">
<meta name="description" content="סיכום שבועי מס׳ 5 — 17.9.2026 — מחוז ירושלים">
<title>סיכום 5 | 17.9.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#15314b;--blue:#174f86;--blue2:#173e62;--muted:#56718b;--paper:#f8fbfe;--mint:#0f807b}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#eaf1f7}body{overflow-x:hidden;color:var(--ink);font-family:'Noto Sans Hebrew',Arial,sans-serif}.document{display:flex;flex-direction:column;align-items:center}.sheet{position:relative;width:min(210mm,100vw);max-width:794px;aspect-ratio:210/297;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover{padding:28px 38px 34px;display:grid;grid-template-rows:auto 1fr auto;gap:18px;background:radial-gradient(circle at 16% 12%,rgba(54,155,220,.15),transparent 27%),radial-gradient(circle at 84% 86%,rgba(239,187,78,.12),transparent 31%),linear-gradient(145deg,#fff,#edf7ff 58%,#f9f4ff)}
.cover-datebar{display:grid;place-items:center;text-align:center}.cover-date-main{margin:0;color:var(--blue2);font:800 clamp(1.9rem,4.6vw,2.7rem)/1.08 Assistant,'Noto Sans Hebrew',Arial,sans-serif}.cover-center{display:grid;place-items:center;align-content:center;gap:18px;text-align:center;min-height:0}.cover-logo{width:112px;height:112px;object-fit:cover;border:2px solid #315d82;border-radius:50%;background:#fff;box-shadow:0 0 0 8px rgba(49,93,130,.05),0 12px 30px rgba(33,73,108,.12);animation:logoTurn 7s linear infinite;will-change:transform}.cover-weekly{margin:0;color:#315d82;font:800 1.5rem/1 Assistant,'Noto Sans Hebrew',Arial,sans-serif}.cover h1{margin:0;color:var(--blue2);font:800 clamp(2.5rem,6vw,3.55rem)/1.05 Assistant,'Noto Sans Hebrew',Arial,sans-serif}.edition{margin:7px 0 0;color:#315d82;font:700 14px Assistant,'Noto Sans Hebrew',Arial,sans-serif}.district{max-width:680px;margin:0;color:#274b69;font:700 clamp(1.15rem,2.7vw,1.38rem)/1.5 'Noto Sans Hebrew',Arial,sans-serif}.district-main,.district-lead{display:block}.district-lead{margin-top:4px;white-space:nowrap}
@keyframes logoTurn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.upcoming{padding:30px 38px;background:radial-gradient(circle at 8% 14%,rgba(43,182,192,.16),transparent 26%),radial-gradient(circle at 92% 88%,rgba(243,177,88,.13),transparent 28%),linear-gradient(145deg,#fffdf9,#eefcfb 52%,#fff3e7)}.upcoming::after{content:"";position:absolute;inset:190px 42px 46px;border-radius:30px;border:1px solid rgba(15,128,123,.10);background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.8);pointer-events:none}.upcoming-top{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 150px;grid-template-areas:"heading author";gap:20px;align-items:start;direction:ltr}.section-head{grid-area:heading;direction:rtl;text-align:right;padding-top:8px}.section-title{margin:6px 0 0;color:var(--blue2);font:800 clamp(3.1rem,7vw,4.5rem)/1.05 Assistant,'Noto Sans Hebrew',Arial,sans-serif}.author-badge{grid-area:author;direction:rtl;display:grid;justify-items:center;gap:5px;text-align:center}.author-badge img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:center;border:4px solid #fff;background:#fff;box-shadow:0 14px 34px rgba(23,79,134,.15)}.author-badge strong{color:var(--blue2);font:800 13px Assistant,'Noto Sans Hebrew',Arial,sans-serif}.author-badge span{color:#607991;font:600 10px/1.35 'Noto Sans Hebrew',Arial,sans-serif}.future-space{position:relative;z-index:1;flex:1;min-height:0}
@media(max-width:600px){.cover{padding:14px 14px 18px;gap:10px}.cover-date-main{font-size:1.25rem}.cover-center{gap:10px}.cover-logo{width:72px;height:72px}.cover-weekly{font-size:.92rem}.cover h1{font-size:1.78rem}.edition{font-size:8px}.district{font-size:.76rem;line-height:1.45}.upcoming{padding:15px 13px}.upcoming::after{inset:112px 14px 18px;border-radius:16px}.upcoming-top{grid-template-columns:1fr 76px;gap:8px}.section-head{padding-top:2px}.section-title{font-size:2.2rem}.author-badge img{width:58px;height:58px;border-width:2px}.author-badge strong{font-size:8px}.author-badge span{font-size:6px}}
@media(prefers-reduced-motion:reduce){.cover-logo{animation:none}}
@media print{html,body{background:#fff}.document{display:block}.sheet{width:210mm;max-width:none;height:297mm;aspect-ratio:auto;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<main class="document">
<section class="sheet cover" aria-label="שער סיכום שבועי מספר 5">
  <div class="cover-datebar"><p class="cover-date-main">יום חמישי · ו׳ בתשרי תשפ״ז</p></div>
  <div class="cover-center">
    <img class="cover-logo" src="https://raw.githubusercontent.com/yanivmizrachiy/zaviyot-digital-workbook/main/public/logo.png" alt="לוגו מחוז ירושלים">
    <p class="cover-weekly">סיכום שבועי</p>
    <div><h1>סיכום שבועי</h1><p class="edition">סיכום מס׳ 5</p></div>
    <p class="district"><span class="district-main">הדרכה במחוז ירושלים והעיר ירושלים – מנח״י</span><span class="district-lead">בהובלת איילת קריספין</span></p>
  </div>
  <div aria-hidden="true"></div>
</section>
<section class="sheet upcoming" aria-label="מה צפוי">
  <div class="upcoming-top">
    <header class="section-head"><h2 class="section-title">מה צפוי?</h2></header>
    <aside class="author-badge" aria-label="יניב רז">
      <img src="https://jerusalem-weekly-sep10.vercel.app/assets/yaniv.jpg" alt="יניב רז">
      <strong>יניב רז</strong>
      <span>מדריך מחוזי חט״ב בעיר ירושלים</span>
    </aside>
  </div>
  <div class="future-space" aria-label="אזור להמשך תוכן"></div>
</section>
</main>
</body>
</html>
