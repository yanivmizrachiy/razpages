name: Update Summary 5 topic orbs

on:
  push:
    branches: ["summary5-orb-topics-20260917"]
    paths:
      - ".github/workflows/summary5-orb-topics.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-orb-topics-20260917
      - name: Group topic lines under one rotating orb
        run: python scripts/summary5-orb-topics.py
      - name: Commit update
        run: |
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Use one rotating orb per topic in Summary 5"
          git push origin HEAD:summary5-orb-topics-20260917
