name: Summary 5 mobile redesign

on:
  push:
    branches: ["summary5-mobile-redesign-20260917"]
    paths:
      - ".github/workflows/summary5-mobile-redesign.yml"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-mobile-redesign-20260917
      - name: Redesign Summary 5 for mobile reading
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/summary5_mobile.py
          python /tmp/summary5_mobile.py
      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Redesign Summary 5 for mobile reading"
          git push origin HEAD:summary5-mobile-redesign-20260917
