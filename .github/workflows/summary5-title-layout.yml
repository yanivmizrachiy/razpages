name: Update Summary 5 title and layout

on:
  push:
    branches: ["summary5-title-layout-20260917"]
    paths:
      - ".github/workflows/summary5-title-layout.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-title-layout-20260917
      - name: Update Summary 5
        run: python scripts/summary5-title-layout.py
      - name: Commit update
        run: |
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Rename events section and align author right"
          git push origin HEAD:summary5-title-layout-20260917
