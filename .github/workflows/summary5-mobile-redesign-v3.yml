name: Summary 5 mobile redesign v3

on:
  push:
    branches: ["summary5-mobile-redesign-20260917"]
    paths:
      - ".github/workflows/summary5-mobile-redesign-v3.yml"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-mobile-redesign-20260917
      - name: Apply mobile-first redesign and content updates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'summary-5.html';
          let s = fs.readFileSync(p, 'utf8');

          const oldDate = '<div class="cover-datebar"><p class="cover-date-main">יום חמישי · ו׳ בתשרי תשפ״ז</p></div>';
          const newDate = '<div class="cover-datebar modern-datebar"><div class="date-gregorian" dir="ltr">17.9.2026</div><div class="date-hebrew"><span>יום חמישי</span><strong>ו׳ בתשרי תשפ״ז</strong></div></div>';
          if (s.includes(oldDate)) s = s.replace(oldDate, newDate);
          s = s.replace('    <p class="cover-weekly">סיכום שבועי</p>\n', '');

          const oldCommunity = '<div class="row"><span class="orb" aria-hidden="true"></span><p class="text box"><strong>קהילות מתמטיקה</strong><br>ההרשמה להשתלמות רכזי מתמטיקה בירושלים ובעיר ירושלים פתוחה. <strong class="red-focus">מספר המקומות מוגבל</strong>. <a class="link" href="https://docs.google.com/forms/d/1bnZ2j8x9UpR4l-2R5dr6-z0eg0Ai6EO1qpPkGnFm8fk/preview" target="_blank" rel="noopener noreferrer">להרשמה להשתלמות לחצו כאן</a>.</p></div>';
          const meetings = '<div class="row"><span class="orb" aria-hidden="true"></span><p class="text box"><strong>מפגש ראשון – השתלמות קהילת מורים:</strong> המפגש הראשון בהשתלמות יתקיים ביום <strong>רביעי, 07.10.2026</strong>, בשעה <strong>19:00–21:30</strong>.</p></div>\n    <div class="row"><span class="orb" aria-hidden="true"></span><p class="text box"><strong>מפגש ראשון – השתלמות קהילת רכזים:</strong> המפגש הראשון בהשתלמות יתקיים ביום <strong>ראשון, 25.10.2026</strong>, בשעה <strong>19:00–21:30</strong>. <strong class="red-focus">מספר המקומות מוגבל</strong>. <a class="link" href="https://docs.google.com/forms/d/1bnZ2j8x9UpR4l-2R5dr6-z0eg0Ai6EO1qpPkGnFm8fk/preview" target="_blank" rel="noopener noreferrer">להרשמה להשתלמות הרכזים</a>.</p></div>';
          if (s.includes(oldCommunity)) s = s.replace(oldCommunity, meetings);
          else if (!s.includes('מפגש ראשון – השתלמות קהילת מורים')) {
            const needle = '</div>\n</section>\n\n<section class="sheet page" aria-label="מצפן">';
            if (s.includes(needle)) s = s.replace(needle, '    ' + meetings + '\n  </div>\n</section>\n\n<section class="sheet page" aria-label="מצפן">');
          }

          const css = `
/* Mobile-first premium redesign — 2026-09-17 */
.modern-datebar{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"greg heb";align-items:center;gap:16px;width:100%;padding:14px 16px;border:1px solid rgba(23,79,134,.12);border-radius:20px;background:rgba(255,255,255,.88);box-shadow:0 14px 34px rgba(23,79,134,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.date-gregorian{grid-area:greg;text-align:left;color:#56728a;font:800 1.05rem/1.2 Assistant,'Noto Sans Hebrew',Arial,sans-serif;letter-spacing:.02em}.date-hebrew{grid-area:heb;text-align:right;color:var(--blue2)}.date-hebrew span,.date-hebrew strong{display:block}.date-hebrew span{font:800 1rem/1.2 'Noto Sans Hebrew',Arial,sans-serif}.date-hebrew strong{margin-top:3px;font:900 1.24rem/1.25 Assistant,'Noto Sans Hebrew',Arial,sans-serif}
.text{font-size:1.08rem;line-height:1.74}.page-sub{font-size:1.04rem}.card p{font-size:1rem}.teach-table td,.events-table td{font-size:.97rem}.workbook-card p{font-size:1.05rem}
.final-blessing{position:relative;min-height:74vh;display:grid;place-items:center;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.98),rgba(238,251,250,.96) 48%,rgba(239,245,255,.96));isolation:isolate}.blessing-core{position:relative;z-index:2;max-width:650px;padding:42px 28px}.blessing-core h2{margin:0;color:var(--blue2);font:900 clamp(3rem,8vw,5rem)/1.02 Assistant,'Noto Sans Hebrew',Arial,sans-serif}.blessing-verse{margin:24px 0 12px;color:#0f807b;font:900 clamp(1.55rem,4.5vw,2.3rem)/1.45 'Noto Sans Hebrew',Arial,sans-serif}.blessing-note{margin:0;color:#49677d;font:700 clamp(1rem,2.5vw,1.25rem)/1.65 'Noto Sans Hebrew',Arial,sans-serif}.blessing-orb{position:absolute;border-radius:50%;background:conic-gradient(from 0deg,#0f807b,#20c9c3,#b9fff8,#315d9a,#0f807b);box-shadow:0 0 0 10px rgba(32,201,195,.07),0 20px 60px rgba(23,79,134,.12);animation:blessingFloat 8s ease-in-out infinite alternate,orbSpin 5s linear infinite}.blessing-orb.o1{width:170px;height:170px;right:-38px;top:8%;animation-duration:7s,5s}.blessing-orb.o2{width:120px;height:120px;left:2%;top:18%;animation-duration:9s,6s}.blessing-orb.o3{width:220px;height:220px;left:-80px;bottom:-40px;animation-duration:11s,7s}.blessing-orb.o4{width:95px;height:95px;right:8%;bottom:13%;animation-duration:8.5s,4.5s}@keyframes blessingFloat{from{transform:translate3d(0,-10px,0) scale(.98)}to{transform:translate3d(16px,18px,0) scale(1.04)}}
@media(max-width:700px){html{font-size:18px;scroll-snap-type:none;background:#f5f9fc}body{background:#f5f9fc;overflow-x:hidden}.document{display:block;width:100%;padding:0}.sheet{width:100%;max-width:none;min-height:0;aspect-ratio:auto;overflow:visible;border:0;border-radius:0;box-shadow:none;scroll-snap-align:none}.cover{min-height:100svh;padding:14px 14px 26px;display:flex;flex-direction:column;gap:18px;justify-content:flex-start;background:radial-gradient(circle at 12% 9%,rgba(32,201,195,.16),transparent 34%),radial-gradient(circle at 92% 92%,rgba(23,79,134,.10),transparent 34%),linear-gradient(160deg,#fff 0%,#f7fcfd 58%,#f2f6ff 100%)}.modern-datebar{order:0;padding:13px 12px;border-radius:17px;gap:10px;background:rgba(255,255,255,.94)}.date-gregorian{font-size:1rem}.date-hebrew span{font-size:.96rem}.date-hebrew strong{font-size:1.14rem}.cover-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;flex:1;padding:18px 4px;text-align:center}.cover-logo{width:118px;height:118px}.cover h1{font-size:2.6rem;line-height:1.03}.edition{margin-top:9px;font-size:1.08rem}.district{max-width:350px;font-size:1.08rem;line-height:1.64}.district-lead{white-space:normal;margin-top:7px}.page{padding:18px 14px 30px;background:linear-gradient(180deg,#fff 0%,#f5fafc 100%)}.page::before{display:none}.page-head{margin:0 0 20px;padding:16px 14px;border-radius:18px;gap:12px;align-items:center;background:#fff;box-shadow:0 8px 26px rgba(23,79,134,.07)}.page-title{font-size:2.05rem;line-height:1.08}.page-sub{margin-top:6px;font-size:.98rem;line-height:1.5}.orb-big{width:31px;height:31px}.upcoming-head{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}.upcoming-head>div:first-child{grid-row:2}.upcoming-head .author{grid-row:1;justify-self:end;margin:0;display:flex;flex-direction:row;align-items:center;text-align:right}.author img{width:72px;height:72px}.author-txt strong{font-size:1rem}.author-txt span{max-width:220px;font-size:.8rem;line-height:1.4}.stack{gap:18px}.hello-block{padding:2px 1px 8px;text-align:right}.hello-block .hello{font-size:1.6rem;line-height:1.25;text-align:right}.hello-rule{width:130px;height:4px}.row{grid-template-columns:22px minmax(0,1fr);gap:11px;align-items:start}.orb{width:18px;height:18px;margin-top:8px}.text{font-size:1.08rem;line-height:1.82;color:#1f425b}.box{padding:17px 15px;border-radius:17px;background:#fff;box-shadow:0 8px 24px rgba(23,79,134,.055)}.link{font-size:1.02em;text-decoration-thickness:2px;text-underline-offset:4px}.red-focus{white-space:normal;padding:0 .1em}.red-focus::after{left:-.25em;right:-.25em;top:-.22em;bottom:-.18em}.table-wrap{overflow:visible;border:0;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}.events-table,.events-table tbody,.events-table tr,.events-table td,.teach-table,.teach-table tbody,.teach-table tr,.teach-table td{display:block;width:100%}.events-table thead,.teach-table thead{display:none}.events-table tr,.teach-table tr{margin:0 0 15px;padding:15px;border:1px solid rgba(23,79,134,.10);border-radius:19px;background:#fff;box-shadow:0 8px 24px rgba(23,79,134,.055)}.events-table td,.teach-table td{padding:8px 0!important;border:0!important;background:transparent!important;text-align:right!important;font-size:1.03rem!important;line-height:1.65!important}.events-table td:nth-child(1)::before{content:'תאריך';display:block;color:#607991;font-size:.8rem;font-weight:800}.events-table td:nth-child(2)::before{content:'יום';display:block;color:#607991;font-size:.8rem;font-weight:800}.events-table td:nth-child(3)::before{content:'אירוע';display:block;color:#607991;font-size:.8rem;font-weight:800}.events-table td:nth-child(3){font-size:1.13rem!important;font-weight:850!important;color:var(--blue2)!important}.teach-table td:first-child{padding-bottom:11px!important;margin-bottom:7px;border-bottom:1px solid rgba(23,79,134,.10)!important;font-size:1.28rem!important;font-weight:900!important;color:var(--blue2)!important}.teach-table td.sep,.teach-table td.oct{margin-top:8px;padding:13px!important;border-radius:14px!important}.teach-table td.sep{background:#e9f8f7!important}.teach-table td.oct{background:#edf3ff!important}.teach-table td.sep::before,.teach-table td.oct::before{display:block;margin-bottom:5px;font-size:.84rem;font-weight:900}.teach-table td.sep::before{content:'ספטמבר';color:#0f716c}.teach-table td.oct::before{content:'אוקטובר';color:#315d9a}.teach-note{margin:12px 2px 0;font-size:.96rem;line-height:1.62}.cards{grid-template-columns:1fr;gap:15px}.card{padding:18px 16px;border-radius:19px;background:#fff}.card h3{font-size:1.46rem}.date-chip{font-size:.88rem}.card p{font-size:1.04rem;line-height:1.75}.workbook-card{margin-top:0;padding:20px 17px;border-radius:20px}.workbook-card h3{font-size:1.55rem}.workbook-card p{font-size:1.05rem;line-height:1.68}.btn{display:block;width:100%;padding:14px 16px;text-align:center;font-size:1.03rem;border-radius:14px}.footer-note{margin-top:20px;font-size:.9rem;line-height:1.52}.final-blessing{min-height:88svh}.blessing-core{padding:42px 24px}.blessing-core h2{font-size:3.35rem}.blessing-verse{font-size:1.65rem}.blessing-note{font-size:1.06rem}.blessing-orb.o1{width:128px;height:128px}.blessing-orb.o2{width:92px;height:92px}.blessing-orb.o3{width:155px;height:155px}.blessing-orb.o4{width:74px;height:74px}}
@media(max-width:380px){html{font-size:17px}.page{padding-inline:12px}.modern-datebar{padding-inline:10px}.date-hebrew strong{font-size:1.06rem}.date-gregorian{font-size:.95rem}.cover h1{font-size:2.28rem}.text{font-size:1.05rem}}
@media(prefers-reduced-motion:reduce){.blessing-orb{animation:none}}
`;
          if (!s.includes('/* Mobile-first premium redesign — 2026-09-17 */')) s = s.replace('</style>', css + '\n</style>');

          if (!s.includes('aria-label="גמר חתימה טובה"')) {
            const finale = `
<section class="sheet final-blessing" aria-label="גמר חתימה טובה">
  <span class="blessing-orb o1" aria-hidden="true"></span><span class="blessing-orb o2" aria-hidden="true"></span><span class="blessing-orb o3" aria-hidden="true"></span><span class="blessing-orb o4" aria-hidden="true"></span>
  <div class="blessing-core">
    <h2>גמר חתימה טובה</h2>
    <p class="blessing-verse">״לִפְנֵי ה׳ תִּטְהָרוּ״</p>
    <p class="blessing-note">גם במתמטיקה וגם בחיים — עוצרים, בודקים, מתקנים וממשיכים בדרך מדויקת יותר.</p>
  </div>
</section>`;
            s = s.replace('</main>', finale + '\n</main>');
          }

          s = s.replace(/>\s*(דמו|DEMO|Demo)\s*</g, '><');
          fs.writeFileSync(p, s, 'utf8');
          NODE
      - name: Verify requested changes
        shell: bash
        run: |
          grep -q 'modern-datebar' summary-5.html
          grep -q '17.9.2026' summary-5.html
          grep -q 'ו׳ בתשרי תשפ״ז' summary-5.html
          grep -q 'מפגש ראשון – השתלמות קהילת מורים' summary-5.html
          grep -q '25.10.2026' summary-5.html
          grep -q 'גמר חתימה טובה' summary-5.html
          if grep -Eqi '>[^<]*(דמו|demo)[^<]*<' summary-5.html; then echo 'Demo text remains'; exit 1; fi
      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete mobile-first Summary 5 redesign"
          git push origin HEAD:summary5-mobile-redesign-20260917
