name: Polish Summary 5 technology

on:
  push:
    branches: ["summary5-tech-polish-20260917"]
    paths:
      - ".github/workflows/summary5-tech-polish.yml"
      - "scripts/summary5-tech-polish.cjs"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-tech-polish-20260917
      - name: Upgrade Summary 5 UI
        run: node scripts/summary5-tech-polish.cjs
      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Polish Summary 5 UI and remove hello orb"
          git push origin HEAD:summary5-tech-polish-20260917
