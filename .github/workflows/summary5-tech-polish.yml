name: Polish Summary 5 technology

on:
  push:
    branches: ["summary5-tech-polish-20260917"]
    paths:
      - ".github/workflows/summary5-tech-polish.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-tech-polish-20260917
      - name: Upgrade Summary 5 UI
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'summary-5.html';
          let s = fs.readFileSync(p, 'utf8');

          s = s.replace(
            '<div class="row"><span class="orb" aria-hidden="true"></span><p class="text hello">שלום לכולם,</p></div>',
            '<div class="hello-block"><p class="text hello">שלום לכולם,</p><span class="hello-rule" aria-hidden="true"></span></div>'
          );

          const cssAnchor = '.footer-note{margin-top:auto;text-align:center;color:#70869a;font:600 .78rem/1.45 \'Noto Sans Hebrew\',Arial}';
          const techCss = `${cssAnchor}

/* 2026 technology polish */
html{scroll-behavior:smooth;scroll-snap-type:y proximity;background:radial-gradient(circle at 15% 8%,rgba(32,201,195,.10),transparent 26%),radial-gradient(circle at 88% 92%,rgba(23,79,134,.12),transparent 28%),#eaf1f7}
body{background:transparent}.sheet{scroll-snap-align:start;isolation:isolate;border:1px solid rgba(255,255,255,.72);box-shadow:0 28px 70px rgba(24,60,92,.13),0 2px 12px rgba(24,60,92,.06)}
.page::before{content:"";position:absolute;z-index:-1;inset:-18%;pointer-events:none;background:conic-gradient(from 190deg at 50% 50%,transparent 0 22%,rgba(32,201,195,.055) 30%,transparent 38% 62%,rgba(49,93,154,.045) 71%,transparent 79%);filter:blur(24px);animation:ambientShift 16s ease-in-out infinite alternate}
@keyframes ambientShift{from{transform:translate3d(-1.5%,0,0) rotate(-2deg)}to{transform:translate3d(1.5%,1%,0) rotate(2deg)}}
.page-head{padding:14px 16px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.74),rgba(244,251,253,.56));box-shadow:0 12px 28px rgba(23,79,134,.055)}
.hello-block{display:grid;grid-template-columns:1fr;gap:8px;padding:2px 0 4px}.hello-block .hello{margin:0}.hello-rule{display:block;width:min(170px,38%);height:4px;border-radius:999px;background:linear-gradient(90deg,var(--turq),rgba(23,79,134,.78),transparent);box-shadow:0 4px 14px rgba(32,201,195,.18)}
.box,.card,.workbook-card,.table-wrap{backdrop-filter:saturate(1.08) blur(10px);-webkit-backdrop-filter:saturate(1.08) blur(10px)}
.link,.btn{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease,filter .22s ease}.card,.box,.workbook-card,.table-wrap{transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}.events-table tbody tr,.teach-table tbody tr{transition:filter .2s ease,transform .2s ease}
.link:focus-visible,.btn:focus-visible{outline:3px solid rgba(32,201,195,.38);outline-offset:4px;border-radius:8px}
::selection{background:rgba(32,201,195,.24);color:var(--blue2)}
@media(hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(23,79,134,.22);filter:saturate(1.08)}.link:hover{filter:saturate(1.15)}.card:hover,.workbook-card:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(23,79,134,.10)}.events-table tbody tr:hover,.teach-table tbody tr:hover{filter:saturate(1.05) brightness(.995)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.box,.card,.workbook-card,.table-wrap,.page-head{background:#fbfdff}}
`;
          if (!s.includes('/* 2026 technology polish */')) {
            if (!s.includes(cssAnchor)) throw new Error('CSS anchor not found');
            s = s.replace(cssAnchor, techCss);
          }

          s = s.replace(
            '@media(prefers-reduced-motion:reduce){.cover-logo,.orb,.orb-big{animation:none}}',
            '@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cover-logo,.orb,.orb-big,.page::before{animation:none}.link,.btn,.card,.box,.workbook-card,.table-wrap,.events-table tbody tr,.teach-table tbody tr{transition:none}}'
          );

          s = s.replace(
            '@media print{html,body{background:#fff}.document{display:block}.sheet{width:210mm;max-width:none;height:297mm;aspect-ratio:auto;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}@page{size:A4 portrait;margin:0}}',
            '@media print{html,body{background:#fff;scroll-snap-type:none}.document{display:block}.sheet{width:210mm;max-width:none;height:297mm;aspect-ratio:auto;page-break-after:always;break-after:page;border:0;box-shadow:none}.page::before{display:none}.sheet:last-child{page-break-after:auto;break-after:auto}@page{size:A4 portrait;margin:0}}'
          );

          fs.writeFileSync(p, s, 'utf8');
          NODE
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Polish Summary 5 UI and remove hello orb"
          git push origin HEAD:summary5-tech-polish-20260917
