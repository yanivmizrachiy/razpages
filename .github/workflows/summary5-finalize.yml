name: Finalize Summary 5

on:
  push:
    branches: ["summary5-repo-cleanup-20260917"]
    paths:
      - ".github/workflows/summary5-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-repo-cleanup-20260917
      - name: Update Summary 5
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'summary-5.html';
          let s = fs.readFileSync(p, 'utf8');

          if (!s.includes('.red-focus{')) {
            const css = `
/* Red focus mark — adapted from the Moodle guide: surrounds text without covering it. */
.red-focus{position:relative;display:inline-block;white-space:nowrap;font-weight:900;color:inherit;padding:0 .08em;z-index:1}
.red-focus::after{content:"";position:absolute;left:-.46em;right:-.46em;top:-.30em;bottom:-.28em;border:3px solid #dc2626;border-radius:50%;transform:rotate(-2deg);pointer-events:none;box-sizing:border-box;filter:drop-shadow(0 1px 0 rgba(255,255,255,.85));animation:redFocusPulse 2.8s ease-in-out infinite}
@keyframes redFocusPulse{0%,100%{transform:rotate(-2deg) scale(1);opacity:.92}50%{transform:rotate(-1deg) scale(1.035);opacity:1}}
@media(prefers-reduced-motion:reduce){.red-focus::after{animation:none}}
`;
            s = s.replace('</style>', css + '</style>');
          }

          s = s.replace('מתבקש לעשות זאת עוד היום.', 'מתבקש לעשות זאת <span class="red-focus">עוד היום</span>.');
          s = s.replace('<strong>מספר המקומות מוגבל.</strong>', '<strong class="red-focus">מספר המקומות מוגבל</strong>.');

          const communityUrl = 'https://docs.google.com/forms/d/1bnZ2j8x9UpR4l-2R5dr6-z0eg0Ai6EO1qpPkGnFm8fk/preview';
          if (!s.includes(communityUrl)) {
            const trainingLink = '<a class="link" href="https://mpm.education.gov.il/rishum/pitronLemidaMurchav/2027/201590/0/7/true" target="_blank" rel="noopener noreferrer">להרשמה במערכת מצפן</a>.</p></div>';
            const community = `
    <div class="row"><span class="orb" aria-hidden="true"></span><p class="text box"><strong>קהילות מתמטיקה</strong><br>ההרשמה להשתלמות רכזי מתמטיקה בירושלים ובעיר ירושלים פתוחה. <strong class="red-focus">מספר המקומות מוגבל</strong>. <a class="link" href="${communityUrl}" target="_blank" rel="noopener noreferrer">להרשמה להשתלמות לחצו כאן</a>.</p></div>`;
            if (!s.includes(trainingLink)) throw new Error('Training link marker not found');
            s = s.replace(trainingLink, trainingLink + community);
          }

          fs.writeFileSync(p, s, 'utf8');
          NODE
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Add red focus marks and math communities registration"
          git push origin HEAD:summary5-repo-cleanup-20260917
