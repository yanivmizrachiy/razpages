name: One-shot dependency security fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-dependency-security-fix.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair vulnerable transitive dependencies in lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Verify no high-severity vulnerabilities remain
        run: npm audit --audit-level=high
      - name: Verify math rendering contract still passes
        run: npm run validate:math-rendering
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Fix vulnerable transitive npm dependencies'
          git push origin HEAD:main
