name: Summary 5 add BSD
on:
  push:
    branches:
      - summary5-batch-edits-20260917
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bsd-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: summary5-batch-edits-20260917
          fetch-depth: 0
      - name: Add BSD to cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('summary-5.html')
          s = p.read_text(encoding='utf-8')
          if 'class="bsd"' not in s:
              s = s.replace('.cover{', '.bsd{align-self:flex-end;margin:0 2px -8px;color:#173e62;font:900 1rem/1.2 \'Noto Sans Hebrew\',Arial,sans-serif;letter-spacing:.02em}\n.cover{', 1)
              s = s.replace('<section class="sheet cover" aria-label="שער הסיכום השבועי">', '<section class="sheet cover" aria-label="שער הסיכום השבועי">\n  <div class="bsd">בס״ד</div>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "Yaniv Raz"
          git config user.email "yanivmiz77@gmail.com"
          git add summary-5.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add BSD to Summary 5 [bsd-applied]"
          git push origin HEAD:summary5-batch-edits-20260917
