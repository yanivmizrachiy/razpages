name: Update Summary 5 Moodle paragraph

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/summary5-moodle-update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Moodle paragraph
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'summary-5.html';
          let s = fs.readFileSync(p, 'utf8');
          const href = 'https://yanivmizrachiy.github.io/moodle-guide-presentation/';
          const re = /<div class="content-row"><span class="orb" aria-hidden="true"><\/span><p class="content-text"><span class="survey-label">מדריך Moodle למורים:<\/span>[\s\S]*?<a class="survey-link" href="https:\/\/yanivmizrachiy\.github\.io\/moodle-guide-presentation\/" target="_blank" rel="noopener noreferrer">לפתיחת המדריך לחצו כאן<\/a>\.<\/p><\/div>/;
          const replacement = '<div class="content-row"><span class="orb" aria-hidden="true"></span><p class="content-text"><span class="survey-label">מדריך Moodle למורים:</span> השבוע התקיימה הדרכה בנושא Moodle, ובקרוב נפרסם מתי יתקיימו הדרכות נוספות. כל המורים המלמדים בחטיבות הביניים צריכים לפתוח מרחבי למידה בכיתות שבהן הם מלמדים, וכל תלמידי חטיבות הביניים צריכים להיות מחוברים למרחבי הלמידה. המדריך המקיף למורים מרכז באופן נוח את כל מה שצריך לדעת על מרחבי הלמידה ב־Moodle, והוא ימשיך להתעדכן בהתאם לצורך. <a class="survey-link" href="' + href + '" target="_blank" rel="noopener noreferrer">לפתיחת המדריך לחצו כאן</a>.</p></div>';
          if (!re.test(s)) throw new Error('Moodle paragraph not found');
          s = s.replace(re, replacement);
          fs.writeFileSync(p, s, 'utf8');
          NODE
      - name: Commit update
        run: |
          git config user.name "Summary 5 updater"
          git config user.email "actions@users.noreply.github.com"
          git add summary-5.html
          git commit -m "Update Moodle guidance in Summary 5"
          git push
