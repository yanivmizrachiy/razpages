name: Validate and deploy parabula-next

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.classify.outputs.mobile }}
      mobile_deep: ${{ steps.classify.outputs.mobile_deep }}
      pythagoras: ${{ steps.classify.outputs.pythagoras }}
      maintenance_only: ${{ steps.classify.outputs.maintenance_only }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
      reason: ${{ steps.classify.outputs.reason }}
      mobile_deep_reason: ${{ steps.classify.outputs.mobile_deep_reason }}
      pythagoras_reason: ${{ steps.classify.outputs.pythagoras_reason }}
      maintenance_reason: ${{ steps.classify.outputs.maintenance_reason }}
    steps:
      - name: Checkout with history for change classification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify validation scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-change-scope.mjs

      - name: Publish classification summary
        run: |
          {
            echo "### CI change scope"
            echo "- Mobile browser gates: ${{ steps.classify.outputs.mobile }}"
            echo "- Deep all-pages mobile gate: ${{ steps.classify.outputs.mobile_deep }}"
            echo "- Pythagoras browser gate: ${{ steps.classify.outputs.pythagoras }}"
            echo "- Maintenance-only path: ${{ steps.classify.outputs.maintenance_only }}"
            echo "- Changed files: ${{ steps.classify.outputs.changed_count }}"
            echo "- Mobile reason: ${{ steps.classify.outputs.reason }}"
            echo "- Mobile deep reason: ${{ steps.classify.outputs.mobile_deep_reason }}"
            echo "- Pythagoras reason: ${{ steps.classify.outputs.pythagoras_reason }}"
            echo "- Maintenance reason: ${{ steps.classify.outputs.maintenance_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Project-wide math rendering contract
        run: |
          npm run validate:math-rendering
          node --test tests/contracts/math-rendering-contract.test.mjs

      - name: Lean maintenance validation
        if: needs.scope.outputs.maintenance_only == 'true'
        run: |
          npm run health:report
          node --test tests/contracts/deploy-ci-scope.test.mjs

      - name: Dependency security audit
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm audit --audit-level=high

      - name: Contract tests
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm test

      - name: Canonical page verification
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm run verify

      - name: Metadata registry and schema
        if: needs.scope.outputs.maintenance_only != 'true'
        run: |
          npm run validate:meta
          npm run validate:schema

      - name: Curriculum taxonomy
        if: needs.scope.outputs.maintenance_only != 'true'
        run: |
          npm run curriculum:check
          npm run validate:curriculum

      - name: Canonical Pythagoras workbook
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm run validate:pythagoras

      - name: Systems solution space
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm run systems:check

      - name: Access and mobile architecture
        if: needs.scope.outputs.maintenance_only != 'true'
        run: |
          npm run validate:access
          npm run validate:mobile

      - name: Canonical rules
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm run rules:check

      - name: Upload canonical-rules report
        if: always() && needs.scope.outputs.maintenance_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-rules-report
          path: meta/audit/rules-source-validation.json
          if-no-files-found: warn
          retention-days: 3

      - name: HTML and vendored dependencies
        if: needs.scope.outputs.maintenance_only != 'true'
        run: |
          npm run validate:html
          npm run vendorize:check

      - name: Repository health
        if: needs.scope.outputs.maintenance_only != 'true'
        run: npm run health:report

      - name: Recovery, preview and app-layer audits
        if: needs.scope.outputs.maintenance_only != 'true'
        run: |
          node scripts/recovery-audit.mjs
          node scripts/preview-guard.mjs
          node scripts/preview-style-audit.mjs
          node scripts/app-layer-check.mjs
          node scripts/duplicate-audit.mjs

      - name: Upload consolidated health audits
        if: always() && needs.scope.outputs.maintenance_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repository-health-audits
          path: |
            meta/audit/recovery-audit.json
            meta/audit/preview-guard.json
            meta/audit/preview-style-audit.json
            meta/audit/app-layer-check.json
            meta/audit/duplicate-audit.json
          if-no-files-found: warn
          retention-days: 3

      - name: Build production artifact
        run: npm run build

      - name: Stamp production artifact with commit identity
        if: github.event_name != 'pull_request'
        run: node scripts/write-build-info.mjs dist "$GITHUB_SHA"

      - name: Upload production build for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 1

  mobile-browser-gate:
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android production browser gate
        run: npm run validate:mobile:browser

      - name: Upload Android browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-report
          path: meta/audit/mobile-browser-validation.json
          if-no-files-found: error
          retention-days: 3

  mobile-interaction-gate:
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Run Android, iPhone WebKit and offline journeys
        run: npm run validate:mobile:interactions

      - name: Upload interaction report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-interaction-report
          path: |
            meta/audit/mobile-interactions-validation.json
            meta/audit/mobile-interaction-failures
          if-no-files-found: warn
          retention-days: 3

  pythagoras-browser-gate:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip heavy Pythagoras checks when unrelated
        if: needs.scope.outputs.pythagoras != 'true'
        run: echo "No canonical Pythagoras files changed; heavy browser gate skipped."

      - name: Checkout
        if: needs.scope.outputs.pythagoras == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: needs.scope.outputs.pythagoras == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: needs.scope.outputs.pythagoras == 'true'
        run: npm ci

      - name: Validate static Pythagoras contracts
        if: needs.scope.outputs.pythagoras == 'true'
        run: |
          npm run pythagoras:check
          node scripts/pythagoras-solution-capacity-audit.mjs --strict

      - name: Install Chromium
        if: needs.scope.outputs.pythagoras == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify Pythagoras workbook in Chromium
        if: needs.scope.outputs.pythagoras == 'true'
        run: node scripts/validate-pythagoras-workbook-browser.mjs

      - name: Audit canonical Pythagoras A4 pages
        if: needs.scope.outputs.pythagoras == 'true'
        shell: bash
        run: |
          PYTHAGORAS_FILES="$(node --input-type=module -e "import fs from 'node:fs'; import {buildPythagorasWorkbook} from './pythagoras-workbook-model.js'; const meta=JSON.parse(fs.readFileSync('meta/topics.json','utf8')); const book=buildPythagorasWorkbook(meta); process.stdout.write(book.pages.map((p)=>p.file).join(' '));")"
          node scripts/a4-utilization-audit.mjs --min=80 $PYTHAGORAS_FILES

      - name: Enforce Pythagoras writing capacity
        if: needs.scope.outputs.pythagoras == 'true'
        run: node scripts/pythagoras-writing-capacity-browser-audit.mjs

      - name: Enforce Pythagoras whitespace limits
        if: needs.scope.outputs.pythagoras == 'true'
        run: node scripts/pythagoras-whitespace-audit.mjs --max-gap=40 --max-trailing=40

  mobile-deep-gate:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.mobile_deep == 'true'
    name: Deep mobile audit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build

      - name: Audit every assigned page in app-reader and open-full
        run: node scripts/validate-mobile-all-pages.mjs --shard-index=${{ matrix.shard }} --shard-count=8

      - name: Upload deep mobile report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-deep-shard-${{ matrix.shard }}
          path: |
            meta/audit/mobile-all-pages-shard-${{ matrix.shard }}.json
            meta/audit/mobile-layout-failures-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  required-main-gate:
    name: Required main gate
    if: always()
    needs: [build, mobile-browser-gate, mobile-interaction-gate, mobile-deep-gate, pythagoras-browser-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce authoritative validation result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MOBILE_BROWSER_RESULT: ${{ needs.mobile-browser-gate.result }}
          MOBILE_INTERACTION_RESULT: ${{ needs.mobile-interaction-gate.result }}
          MOBILE_DEEP_RESULT: ${{ needs.mobile-deep-gate.result }}
          PYTHAGORAS_RESULT: ${{ needs.pythagoras-browser-gate.result }}
        shell: bash
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "build must succeed; got: $BUILD_RESULT"
            exit 1
          fi

          for gate in \
            "mobile-browser:$MOBILE_BROWSER_RESULT" \
            "mobile-interaction:$MOBILE_INTERACTION_RESULT" \
            "mobile-deep:$MOBILE_DEEP_RESULT" \
            "pythagoras:$PYTHAGORAS_RESULT"
          do
            name="${gate%%:*}"
            result="${gate#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name gate must succeed or be intentionally skipped; got: $result"
                exit 1
                ;;
            esac
          done

  deploy:
    if: ${{ always() && github.event_name != 'pull_request' && needs.required-main-gate.result == 'success' }}
    needs: [build, required-main-gate]
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout live verification scripts
        uses: actions/checkout@v4

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live deployment commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-live-build.mjs "$PAGE_URL" "$EXPECTED_SHA"

      - name: Mark commit as live on Pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d '{"state":"success","context":"live-pages","description":"GitHub Pages serves this commit"}'
