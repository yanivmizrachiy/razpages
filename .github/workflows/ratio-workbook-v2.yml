name: Ratio Workbook Live Pages

on:
  push:
    branches:
      - main
      - agent/ratio-canonical-live-pages
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/render-ratio-workbook.mjs'
      - 'scripts/export-ratio-workbook-live.mjs'
      - 'scripts/import-ratio-workbook.mjs'
      - 'tests/contracts/ratio-workbook-*'
      - 'styles/topics/ratio-live.css'
      - 'styles/pages/עמוד-*.css'
      - 'עמוד-*.html'
      - 'package.json'
      - '.github/workflows/ratio-workbook-v2.yml'
  pull_request:
    paths:
      - 'sources/lovable/ratio-workbook/**'
      - 'scripts/render-ratio-workbook.mjs'
      - 'scripts/export-ratio-workbook-live.mjs'
      - 'scripts/import-ratio-workbook.mjs'
      - 'tests/contracts/ratio-workbook-*'
      - 'styles/topics/ratio-live.css'
      - 'styles/pages/עמוד-*.css'
      - 'עמוד-*.html'
      - 'package.json'
      - '.github/workflows/ratio-workbook-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-workbook-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sources/lovable/ratio-workbook/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install ratio workbook dependencies
        run: npm ci --prefix sources/lovable/ratio-workbook --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify stable ratio numbering and navigation
        run: npm run ratio:contracts

      - name: Test ratio mathematics and source structure
        run: npm run ratio:test

      - name: Render and audit all 48 source A4 pages
        run: npm run ratio:render

      - name: Export 48 canonical live HTML pages
        run: npm run ratio:export

      - name: Verify live HTML contracts
        run: npm run ratio:live-contracts

      - name: Verify exporter idempotency
        run: npm run ratio:export:check

      - name: Run repository contract suite
        shell: bash
        run: |
          set +e
          npm run ci:all 2>&1 | tee ratio-ci-all.log
          ci_status=${PIPESTATUS[0]}
          printf 'ci_status=%s\n' "$ci_status" > ratio-ci-status.txt
          exit "$ci_status"

      - name: Run mobile browser checks with diagnostics
        shell: bash
        run: |
          set +e
          npm run validate:mobile:browser 2>&1 | tee mobile-browser.log
          browser_status=${PIPESTATUS[0]}
          npm run validate:mobile:interactions 2>&1 | tee mobile-interactions.log
          interactions_status=${PIPESTATUS[0]}
          printf 'browser_status=%s\ninteractions_status=%s\n' "$browser_status" "$interactions_status" > mobile-status.txt
          if [ "$browser_status" -ne 0 ] || [ "$interactions_status" -ne 0 ]; then
            exit 1
          fi

      - name: Package generated canonical pages
        shell: bash
        run: |
          rm -rf ratio-generated
          mkdir -p ratio-generated/styles/pages ratio-generated/styles/topics
          for number in $(seq 272 319); do
            cp -- "עמוד-${number}.html" ratio-generated/
            cp -- "styles/pages/עמוד-${number}.css" ratio-generated/styles/pages/
          done
          cp -- styles/topics/ratio-live.css ratio-generated/styles/topics/
          if [ -d assets/ratio/live ]; then
            mkdir -p ratio-generated/assets/ratio
            cp -a assets/ratio/live ratio-generated/assets/ratio/
          fi

      - name: Upload generated pages and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-workbook-live-audit
          path: |
            ratio-generated/
            assets/ratio/audit-v2.json
            assets/ratio/page-001.png
            assets/ratio/page-004.png
            assets/ratio/page-005.png
            assets/ratio/page-006.png
            assets/ratio/page-007.png
            assets/ratio/page-011.png
            assets/ratio/page-013.png
            assets/ratio/page-016.png
            assets/ratio/page-029.png
            ratio-ci-all.log
            ratio-ci-status.txt
            mobile-browser.log
            mobile-interactions.log
            mobile-status.txt
            test-results/
          if-no-files-found: warn

      - name: Commit generated canonical pages
        if: github.event_name == 'push' && github.ref_name == 'agent/ratio-canonical-live-pages'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for number in $(seq 272 319); do
            git add -- "עמוד-${number}.html" "styles/pages/עמוד-${number}.css"
          done
          git add -- styles/topics/ratio-live.css
          if [ -d assets/ratio/live ]; then
            git add -A -- assets/ratio/live
          fi
          if git diff --cached --quiet; then
            echo "Canonical live ratio pages are already current."
          else
            git commit -m "feat(יחס): עדכון דפי HTML חיים מאומתים"
            git push origin HEAD:agent/ratio-canonical-live-pages
          fi
