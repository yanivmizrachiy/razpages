<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>חוברת הגליל</title>
  <link rel="stylesheet" href="../viewer.css">
</head>
<body class="workbook-viewer" data-workbook="cylinder" data-title="חוברת הגליל">
  <nav class="workbook-toolbar" aria-label="ניווט בחוברת הגליל">
    <span class="workbook-brand"><strong>חוברת הגליל</strong><span class="workbook-subtitle">כל דפי הגליל ברצף אחד</span></span>
    <select id="stage" class="workbook-select" aria-label="בחירת שלב לימודי" hidden></select>
    <button class="workbook-control" id="prev" type="button">הקודם</button>
    <span class="workbook-progress">עמוד <input id="page" class="workbook-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="מספר עמוד"> מתוך <strong id="total">—</strong></span>
    <button class="workbook-control" id="next" type="button">הבא</button>
    <a id="open" class="workbook-link" href="page-1.html" target="_blank" rel="noopener">פתח דף מלא</a>
    <a class="workbook-link workbook-link-primary" href="../print.html?book=cylinder">הדפסה מלאה</a>
    <a class="workbook-link" href="../index.html">כל החוברות</a>
    <div class="workbook-stage-note" id="stage-note" hidden></div>
  </nav>
  <main class="workbook-frame-wrap"><iframe id="sheet" class="workbook-frame" title="חוברת הגליל — עמוד 1" src="page-1.html"></iframe></main>
  <script type="module" src="../viewer.js"></script>
</body>
</html>
