<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=https://yanivmizrachiy.github.io/pythagoras/" />
  <link rel="canonical" href="https://yanivmizrachiy.github.io/pythagoras/" />
  <title>משפט פיתגורס — מעבר למקור הקנוני</title>
  <script>
    (() => {
      const target = new URL('https://yanivmizrachiy.github.io/pythagoras/');
      const requestedPage = new URL(location.href).searchParams.get('page');
      if (requestedPage && /^\d+$/.test(requestedPage)) target.hash = `page=${requestedPage}`;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p><a href="https://yanivmizrachiy.github.io/pythagoras/">מעבר לחוברת פיתגורס הקנונית</a></p>
</body>
</html>
