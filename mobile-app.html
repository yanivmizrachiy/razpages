<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>ספר דפי העבודה של יניב</title>
  <link rel="manifest" href="./mobile-app.webmanifest?v=20260417013000" />
  <link rel="icon" href="./icon.svg?v=20260417013000" type="image/svg+xml" />
  <link rel="stylesheet" href="./mobile-app.css?v=20260427191000" />
</head>
<body class="focus-reading">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-main">
        <strong class="app-title">ספר דפי העבודה של יניב</strong>
        <div id="appMeta" class="app-meta">טוען…</div>
      </div>
      <div class="topbar-actions">
        <button id="openInstallBtn" type="button">התקנה</button>
        <button id="toggleTopicsBtn" type="button">נושאים ודפים</button>
      </div>
    </header>

    <section id="topicsPanel" class="topics-panel is-collapsed">
      <div class="section-title">נושאים</div>
      <div id="topicStrip" class="topic-strip"></div>
      <input id="globalSearch" type="search" placeholder="חיפוש לפי נושא, כותרת או מספר עמוד" />
      <section id="topicPages" class="pages-list"></section>
    </section>

    <section class="reader-box">
      <div class="reader-head">
        <div class="reader-copy">
          <strong id="currentPageTitle">טוען…</strong>
          <span id="currentPageMeta">—</span>
        </div>
        <div class="reader-progress">
          <span id="topicProgress">—</span>
          <span id="globalProgress">—</span>
        </div>
      </div>

      <div id="mobileLoadingState" class="loading-state" hidden>טוען דף…</div>
      <div id="readerNotice" class="reader-notice" hidden></div>
      <div class="reader-tools">
        <div class="reader-mode-toggle" role="group" aria-label="מצב קריאה">
          <button id="readerModeFullBtn" type="button">עמוד מלא</button>
          <button id="readerModeZoomBtn" type="button">קריאה מוגדלת</button>
        </div>
      </div>

      <div class="frame-wrap">
        <iframe id="mobilePageFrame" title="ספר דפי עבודה" src="about:blank" loading="eager"></iframe>
      </div>
    </section>

    <nav class="bottom-nav">
      <button id="prevPageBtn" type="button">הקודם</button>
      <button id="nextPageBtn" type="button">הבא</button>
      <button id="openLiveBtn" type="button">פתח מלא</button>
      <button id="printBtn" type="button">תצוגת PDF</button>
    </nav>
  </div>
  <script src="./mobile-app.js?v=20260427191000"></script>
</body>
</html>
